<title>Diez Minutos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: one-column phone app. Top bar + 5-segment stepper, then the current step as a loteria-style card stage. */
:root{
  --bg:#F4F1FB; --surface:#FFFFFF; --ink:#1B1740; --muted:#5D5882; --line:#D9D3EE;
  --edge:#1B1740; --sun:#F2A900; --sun-ink:#2A1A00; --pink:#D6246E; --teal:#0E9E8B;
  --good:#0F7D55; --bad:#C62B3A; --card:#FFF3D6;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120F2B; --surface:#1D1941; --ink:#F3F0FF; --muted:#A9A3D1; --line:#342E66;
  --edge:#8F86E8; --sun:#FFB627; --sun-ink:#2A1A00; --pink:#FF6BA6; --teal:#2FD3BC;
  --good:#3FD99A; --bad:#FF7A86; --card:#2A2358; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120F2B; --surface:#1D1941; --ink:#F3F0FF; --muted:#A9A3D1; --line:#342E66;
  --edge:#8F86E8; --sun:#FFB627; --sun-ink:#2A1A00; --pink:#FF6BA6; --teal:#2FD3BC;
  --good:#3FD99A; --bad:#FF7A86; --card:#2A2358; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--pink)}
.streak{font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:4px 12px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps button{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.steps i{display:block;height:6px;border-radius:3px;background:var(--line)}
.steps b{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .on i{background:var(--sun)} .steps .on b{color:var(--ink)}
.steps .done i{background:var(--teal)}

/* generic parts */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:17px;
  background:var(--sun);color:var(--sun-ink);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{min-height:42px;font-size:15px;padding:0 14px;box-shadow:3px 3px 0 var(--edge)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}

/* loteria card */
.lota{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:22px;box-shadow:6px 6px 0 var(--edge);
  padding:18px 16px 0;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;min-width:0}
.lnum{position:absolute;top:10px;left:14px;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--muted)}
.lreg{position:absolute;top:10px;right:14px;font-size:13px;font-weight:700;color:var(--muted)}
.lemoji{font-size:clamp(84px,26vw,120px);line-height:1.05;margin-top:10px;transition:transform .25s}
.lemoji.pop{transform:scale(1.12)}
.lphrase{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,7vw,32px);letter-spacing:-.01em;line-height:1.15;margin:8px 0 6px;min-height:2.3em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em;text-wrap:balance}
.lphrase .w{transition:color .12s,filter .2s}
.lphrase .w.on{color:var(--pink)}
.lphrase .w.mask{filter:blur(7px)}
.lphrase.hide{filter:blur(9px);cursor:pointer}
.len{font-size:16px;color:var(--muted);min-height:1.5em;margin-bottom:14px}
.lbar{align-self:stretch;margin:0 -16px;padding:9px 0;background:var(--edge);color:var(--bg);font-family:var(--font-display);font-weight:800;letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.lbar.you{background:var(--pink);color:#fff}
.lbar.listen{background:var(--teal);color:#0A1F1B}
.dots{display:flex;justify-content:center;gap:12px;margin-top:2px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:transform .08s,background .08s}
.dots i.on{background:var(--sun);transform:scale(1.35)}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:12px}
.ctrl label{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--pink)}

/* flashcards / slang */
.tapcard{cursor:pointer;user-select:none}
.tapcard .lphrase{min-height:0}
.hint{font-size:14px;color:var(--muted);padding-bottom:14px}
.big-x{font-size:17px;margin:2px 0 4px}
.xes{font-size:15px;color:var(--muted);margin-bottom:14px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.pager{display:flex;justify-content:center;gap:8px}
.pager i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pager i.on{background:var(--pink)}

/* game */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:3px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--edge);min-height:92px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:17px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.opt.em{font-size:56px;min-height:110px}
.opt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.opt.right{background:var(--teal);color:#06231E;border-color:var(--edge)}
.opt.wrong{background:var(--pink);color:#fff;opacity:.9}
.opt[disabled]{pointer-events:none}
.q{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,6.4vw,28px);text-align:center;line-height:1.15;text-wrap:balance}
.bigplay{width:96px;height:96px;border-radius:50%;font-size:40px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--sun);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.bigplay:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress>div{height:100%;background:var(--pink);width:0;transition:width .3s}
.fb{min-height:56px;text-align:center;font-size:16px}
.fb b{font-family:var(--font-display);font-size:20px;display:block}
.slots{min-height:64px;border:3px dashed var(--edge);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{background:var(--surface);border:3px solid var(--edge);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--edge)}
.tile.used{opacity:.25;pointer-events:none}

/* final */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.week span{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.week .hit span{background:var(--teal);color:#06231E}
.week .today span{outline:3px solid var(--sun)}
.stat{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1}
.mission{border-left:6px solid var(--pink);padding-left:14px}
select{font:inherit;width:100%;min-height:48px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:0 12px}
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.tl li:first-child{border-top:0}
.tl time{font-family:var(--font-display);font-weight:800;color:var(--pink)}
.tl span{color:var(--muted);font-size:14px}
.tl strong{display:block;font-size:16px}
.link{font-size:14px;color:var(--muted);text-decoration:underline;padding:8px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="root">

  <main id="app" aria-live="polite"></main>
</div>

  const days=new Set(S.hist.map(h=>h.d)); let n=0; let d=new Date();

let voices=[];

/* ------------------------------------------------------------------ AUDIO / BEAT */
let ctx=null, master=null, noiseBuf=null;
function ensureCtx(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain(); master.gain.value=.8;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(ctx.state==="suspended") ctx.resume();
  return true;
}
function env(g,t,vol,dur){g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur)}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(48,t+.13);env(g,t,.95,.28);o.connect(g).connect(master);o.start(t);o.stop(t+.3)}
function noise(t,dur,type,freq,vol){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();env(g,t,vol,dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.02)}
function tone(t,freq,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"triangle";o.frequency.value=freq;env(g,t,vol,dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
function snare(t){noise(t,.16,"bandpass",1900,.55);tone(t,190,.1,.25,"triangle")}
function hat(t,v){noise(t,.05,"highpass",7500,v||.14)}
/* Original loop, 96 BPM dembow in A minor: Am - F - C - G. A 3-3-2 marimba hook rides on top of a tresillo bass. */
const ROOTS=[110,87.31,130.81,98];
const HOOK=[ /* [16th step, semitones from A4] per bar */
  [[0,7],[3,7],[6,5],[8,3],[10,5],[12,7],[14,7]],
  [[0,3],[3,3],[6,0],[8,3],[10,5],[12,8],[14,5]],
  [[0,7],[3,7],[6,5],[8,3],[10,5],[12,7],[14,3]],
  [[0,5],[3,5],[6,2],[8,5],[10,7],[12,10],[14,7]]];
const TRIAD=[[0,3,7],[-4,0,3],[-9,-5,-2],[-2,2,5]];   /* chord tones in semitones from A4 (lower octave) */
const hz=n=>440*Math.pow(2,n/12);
function mallet(t,f,vol,dur){dur=dur||.38;const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain();
  o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*4;env(g,t,vol,dur);env(g2,t,vol*.4,.07);
  o.connect(g).connect(master);o2.connect(g2).connect(master);o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+.1)}
function bass(t,f,dur){const o=ctx.createOscillator(),o2=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type="sawtooth";o.frequency.value=f;o2.type="sine";o2.frequency.value=f;fl.type="lowpass";
  fl.frequency.setValueAtTime(900,t);fl.frequency.exponentialRampToValueAtTime(200,t+dur);env(g,t,.42,dur);
  o.connect(fl).connect(g).connect(master);o2.connect(g).connect(master);o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02)}
function clap(t){noise(t,.12,"bandpass",1500,.35);noise(t+.012,.1,"bandpass",2400,.25)}
const Beat={bpm:96,running:false,step:0,bar:0,next:0,timer:null,onBar:null,onBeat:null,
  start(){ if(!ensureCtx()) return; this.stop(); master.gain.value=.85; this.running=true; this.step=0; this.bar=0; this.next=ctx.currentTime+.15; this.timer=setInterval(()=>this.tick(),25)},
  stop(){ this.running=false; clearInterval(this.timer); this.timer=null },
  barDur(){return 240/this.bpm},
  tick(){
    while(this.next<ctx.currentTime+.12){
      this.play(this.step,this.next,this.bar);
      this.step=(this.step+1)%16; if(this.step===0) this.bar++;
      this.next+=60/this.bpm/4;
    }
  },
  play(step,t,bar){
    const cb=(fn,...a)=>{ if(fn) setTimeout(()=>{ if(this.running) fn(...a) },Math.max(0,(t-ctx.currentTime)*1000)) };
    const c=bar%4, r=ROOTS[c], sw=(step%2===1)?.012:0;           /* light swing on the off 16ths */
    /* dembow drums */
    if(step%4===0) kick(t);
    if([3,6,11,14].includes(step)){ snare(t); if(step===3||step===11) clap(t) }
    hat(t+sw, step%4===0?.07:step%2===0?.13:.09);
    if(step===14) noise(t,.18,"highpass",6000,.12);               /* open hat pickup */
    /* tresillo bass */
    if(step===0) bass(t,r,.5);
    if(step===6) bass(t,r,.3);
    if(step===10) bass(t,r*1.5,.3);
    if(step===14 && bar%2===1) bass(t,r*2,.18);
    /* strummed chord on beats 1 and 3 */
    if(step===0||step===8) TRIAD[c].forEach((n,k)=>tone(t+k*.012,hz(n),.45,.07,"triangle"));
    /* the hook */
    HOOK[c].forEach(([s,n])=>{ if(s===step) mallet(t,hz(n),s===0?.3:.24) });
    if(step%4===0) cb(this.onBeat,step/4,bar,t);
    if(step===0) cb(this.onBar,bar,t);
  }
};
function sfx(ok){ if(!ensureCtx()) return; const t=ctx.currentTime;
  if(ok){tone(t,660,.15,.2,"sine");tone(t+.09,880,.22,.2,"sine");tone(t+.18,1320,.3,.12,"sine")} else {tone(t,220,.25,.22,"sawtooth");tone(t+.1,165,.3,.2,"sawtooth")} }

/* ------------------------------------------------------------------ STEPPER */
const STEPS=[

/* ------------------------------------------------------------------ 1 · CALENTAR */
function warm(){
  const i=curIdx(), pi=prevIdx(), first=pi===null;
  let cards=first? L().p.map(x=>({...x,from:"hoy"})) : LESSONS[pi].p.map(x=>({...x,from:"ayer"}));
  const older=shuffle(LESSONS.filter((_,k)=>k!==i&&k!==pi&&k<(S.hist.length||0)).flatMap(l=>l.p)).slice(0,2);
  cards=cards.concat(older.map(x=>({...x,from:"antes"})));
  let k=0, shown=first;
  const draw=()=>{
    const c=cards[k];
    app.innerHTML=`<div class="wrap">
      <div class="meta"><span>${first?"Primer vistazo":"Repaso"}</span><span>${k+1} / ${cards.length}</span></div>
      <div class="lota tapcard" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
        <div class="lnum">${k+1}</div><div class="lreg">${c.from}</div>
        <div class="lemoji" id="lem">${c.e}</div>
        <div class="lphrase" id="lph" style="${shown?"":"visibility:hidden"}">${esc(c.es)}</div>
        <div class="len" id="len">${esc(c.en)}</div>
        <div class="lbar" id="lbar">${shown?"Toca para escuchar 🔊":"Dilo en español, luego toca"}</div></div>
      ${shown?`<div class="row"><button class="btn ghost" id="again">Otra vez</button><button class="btn" id="know">Lo sé ✓</button></div>`
             :`<p class="muted" style="text-align:center">Use the picture and the English to say it in Spanish. Then tap the card to check.</p>`}
      ${shown&&first?`<p class="muted" style="text-align:center">First look: read it, tap the card to hear it, then say it out loud.</p>`:""}
      <div class="pager">${cards.map((_,j)=>`<i class="${j===k?"on":""}"></i>`).join("")}</div></div>`;
    const card=$("#card");
    card.onclick=()=>{ if(!shown){shown=true;draw();say(c.es)} else say(c.es) };
    card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();card.onclick()}};
    if(shown){
      $("#again").onclick=()=>{cards.push(cards.splice(k,1)[0]); shown=first; draw()};
      $("#know").onclick=()=>{ k++; shown=first; if(k>=cards.length) return warmDone(); draw()};
    }
  };
  const warmDone=()=>{
    hush();
    app.innerHTML=`<div class="wrap">${cardHTML({emoji:"🔥",es:"Ya estás caliente",en:"Warmed up. Now the fun part: music.",bar:"Siguiente: ritmo"})}${nextBtn("Al ritmo")}</div>`;
    wireNext();
  };
  draw();
}

/* ------------------------------------------------------------------ 2 · RITMO */
let raf=0;
function chant(){
  const ph=L().p, ROUNDS=6;
  app.innerHTML=`<div class="wrap">
    <div class="meta"><span>Ronda <b id="rnd">1</b> / ${ROUNDS}</span><span id="tl">4 frases</span></div>
    ${cardHTML({num:"",emoji:L().e,es:wordsHTML("Toca ▶ y sigue el ritmo"),en:"Listen on the green bar, say it on the pink bar. Same pause after every phrase.",bar:"Listo?",barCls:""})}
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="row"><button class="btn" id="play">▶ Dale</button><button class="btn ghost" id="peek">👁 Ver texto</button></div>
    <div class="ctrl panel"><label for="bpm">Tempo <span id="bv">96</span></label><input type="range" id="bpm" min="72" max="116" value="96"></div>
    ${nextBtn("Siguiente: slang")}</div>`;
  wireNext();
  /* Timing is driven by the phrase itself, not by bars: every card gets the same pause after the
     voice (listen) and after your turn, so long phrases are no longer rushed and short ones no longer drag. */
  const GAP=1.0, RATE=.85, total=ROUNDS*ph.length;
  let started=false, phase="idle", idx=0, t0=0, peek=false, cur=ph[0], round=0, voiceEnd=null, said=false;
  const durs={};                                              /* measured speech length per phrase */
  const est=t=>durs[t]??(0.45+t.length*0.072*(0.85/RATE));
  const clock=()=>performance.now()/1000;
  const lph=$("#lph"), len=$("#len"), lem=$("#lem"), lbar=$("#lbar"), lnum=document.querySelector(".lnum");
  const dots=[...document.querySelectorAll("#dots i")];
  const paint=()=>{
    const mask = round>=3 && round<5, hideAll = round>=5 && !peek;
    lph.innerHTML=wordsHTML(cur.es,mask); lph.classList.toggle("hide",hideAll);
    len.textContent=cur.en; len.style.visibility=(round<2||peek)?"visible":"hidden";
  };
  $("#peek").onclick=()=>{peek=!peek; $("#peek").textContent=peek?"🙈 Ocultar":"👁 Ver texto"; if(started&&phase!=="idle"&&phase!=="count")paint()};
  $("#bpm").oninput=e=>{Beat.bpm=+e.target.value; $("#bv").textContent=e.target.value};
  Beat.onBeat=(b)=>{dots.forEach((d,j)=>d.classList.toggle("on",j===b))};
  Beat.onBar=null;
  const showCard=()=>{
    round=Math.floor(idx/ph.length); cur=ph[idx%ph.length];
    $("#rnd").textContent=round+1; $("#tl").textContent="Frase "+(idx%ph.length+1)+" / "+ph.length; lnum.textContent=idx%ph.length+1;
    lem.textContent=cur.e; lem.classList.add("pop"); setTimeout(()=>lem.classList.remove("pop"),180);
    paint();
  };
  const startPhase=(ph2)=>{
    phase=ph2; t0=clock(); voiceEnd=null; said=false;
    if(ph2==="count"){ lbar.textContent="Cuenta…"; lbar.className="lbar"; lph.classList.remove("hide"); lph.innerHTML=wordsHTML("1 · 2 · 3 · 4"); len.style.visibility="hidden"; lem.textContent="🥁"; return; }
    if(idx>=total){ return finish(); }
    if(ph2==="listen"){
      showCard(); lbar.textContent="Escucha 👂"; lbar.className="lbar listen";
      if(master) master.gain.setTargetAtTime(.5,ctx.currentTime,.05);
    } else {
      lbar.textContent="Tu turno 🎤"; lbar.className="lbar you";
      if(master) master.gain.setTargetAtTime(.9,ctx.currentTime,.05);
    }
  };
  const speakNow=()=>{
    said=true; const t=cur.es, started0=clock(); let fired=false;
    const done=()=>{ if(fired) return; fired=true; durs[t]=Math.max(.6,clock()-started0); voiceEnd=clock(); };
    try{
      if(!("speechSynthesis" in window)) throw 0;
      speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="es-MX"; const v=pickVoice(); if(v)u.voice=v; u.rate=RATE;
      u.onend=done; u.onerror=done; speechSynthesis.speak(u);
    }catch(e){ setTimeout(done,est(t)*1000) }
    setTimeout(done,(est(t)*2+1.5)*1000);                     /* safety net if the browser never reports the end */
  };
  const loop=()=>{
    if(!Beat.running){ return; }
    const now=clock(), el=now-t0;
    if(phase==="count"){ if(el>=240/Beat.bpm){ idx=0; startPhase("listen") } }
    else if(phase==="listen"){
      if(!said && el>=0.35) speakNow();                       /* land the voice just after the card appears */
      lph.querySelectorAll(".w.on").forEach(w=>w.classList.remove("on"));
      if(voiceEnd!==null && now-voiceEnd>=GAP) startPhase("you");
    } else if(phase==="you"){
      const speakT=est(cur.es)*1.1, p=clamp(el/speakT,0,1);
      const ws=[...lph.querySelectorAll(".w")], lens=ws.map(w=>w.textContent.length+1), tot=lens.reduce((x,y)=>x+y,0);
      let acc=0; ws.forEach((w,j)=>{ w.classList.toggle("on", p*tot>=acc+lens[j]*0.5); acc+=lens[j]; });
      if(el>=speakT+GAP){ idx++; startPhase(idx>=total?"done":"listen") }
    }
    raf=requestAnimationFrame(loop);
  };
  function finish(){
    Beat.stop(); hush(); cancelAnimationFrame(raf); started=false; phase="idle";
    dots.forEach(d=>d.classList.remove("on"));
    lem.textContent="🎉"; lph.classList.remove("hide"); lph.innerHTML=wordsHTML("¡Qué padre, lo lograste!"); len.style.visibility="visible"; len.textContent="Four phrases, six rounds. Say them again in the shower.";
    lbar.textContent="Listo"; lbar.className="lbar listen"; $("#play").textContent="▶ Otra vez"; sfx(true); buzz(60);
    idx=0;
  }
  $("#play").onclick=()=>{
    if(Beat.running){ Beat.stop(); hush(); cancelAnimationFrame(raf); $("#play").textContent="▶ Seguir"; lbar.textContent="Pausa"; lbar.className="lbar"; return; }
    ensureCtx(); Beat.bpm=+$("#bpm").value; Beat.start();
    const resume=started && (phase==="listen"||phase==="you");
    started=true; $("#play").textContent="⏸ Pausa";
    startPhase(resume?phase:"count");
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  };
}

/* ------------------------------------------------------------------ 3 · SLANG */
function slang(){
  const list=L().s; let k=0;
  const draw=()=>{
    const s=list[k];
    app.innerHTML=`<div class="wrap">
      <div class="meta"><span>Expresión ${k+1} / ${list.length}</span><span>${REG[s.r]||s.r}</span></div>
      <div class="lota" id="card"><div class="lnum">${k+1}</div><div class="lreg">${REG[s.r]||""}</div>
        <div class="lemoji">${s.e}</div>
        <div class="lphrase" style="min-height:0;margin-bottom:2px">${esc(s.es)}</div>
        <div class="len" style="font-weight:700;color:var(--ink);margin-bottom:6px">${esc(s.en)}</div>
        <div class="muted" style="font-size:14px;padding:0 4px 12px">${esc(s.note)}</div>
        <div class="lbar">En la calle</div></div>
      <div class="panel"><div class="kicker">Úsalo así</div>
        <p class="big-x"><b>${esc(s.x)}</b></p><p class="xes">${esc(s.xe)}</p>
        <div class="row"><button class="btn small" id="s1">🔊 Normal</button><button class="btn small ghost" id="s2">🐢 Lento</button><button class="btn small ghost" id="s3">🔁 Ritmo</button></div></div>
      <div class="pager">${list.map((_,j)=>`<i class="${j===k?"on":""}"></i>`).join("")}</div>
      <div class="row">${k>0?`<button class="btn ghost" id="prev">← Atrás</button>`:""}<button class="btn" id="nx">${k<list.length-1?"Otra expresión →":"Al juego →"}</button></div></div>`;
    $("#s1").onclick=()=>say(s.x,.88);
    $("#s2").onclick=()=>say(s.x,.6);
    $("#s3").onclick=()=>{ /* say the slang 3 times in a bouncy beat */
      Beat.stop(); ensureCtx(); let n=0; const t0=ctx.currentTime;
      const tick=()=>{ if(n>=3) return; kick(ctx.currentTime); snare(ctx.currentTime+.32); say(s.es,.8); n++; setTimeout(tick,1500) }; tick(); };
    $("#nx").onclick=()=>{ if(k<list.length-1){k++;draw();say(list[k].es,.8)} else go(step+1) };
    const pv=$("#prev"); if(pv) pv.onclick=()=>{k--;draw()};
    $("#card").onclick=()=>say(s.es,.8);
  };
  draw(); say(list[0].es,.8);
}

/* ------------------------------------------------------------------ 4 · JUEGO */
function game(){
  const l=L(), pi=prevIdx(), P=pi===null?null:LESSONS[pi];
  const allP=LESSONS.flatMap(x=>x.p), allS=LESSONS.flatMap(x=>x.s);
  const tp=shuffle(l.p), pp=shuffle(P?P.p:l.p), ts=shuffle(l.s), ps=shuffle(P?P.s:l.s);
  const longest=l.p.slice().sort((a,b)=>b.es.split(" ").length-a.es.split(" ").length);
  const pLong=(P?P.p:l.p).filter(x=>x.es.split(" ").length>=3);
  let qs=[
    {t:"listen",a:tp[0]},{t:"listen",a:tp[1]},{t:"listen",a:pp[0]},
    {t:"emoji",a:tp[2]},{t:"emoji",a:tp[3]},{t:"emoji",a:pp[1]||tp[0]},
    {t:"slang",a:ts[0]},{t:"slang",a:ps[0]},
    {t:"build",a:longest[0]},{t:"build",a:pLong.length?pLong[Math.floor(Math.random()*pLong.length)]:longest[1]}
  ];
  qs=shuffle(qs);
  let qi=0, score=0, combo=0, best=0;
  const distinct=(arr,key,n,exclude)=>{const seen=new Set([exclude]);const out=[];for(const x of shuffle(arr)){if(seen.has(x[key]))continue;seen.add(x[key]);out.push(x);if(out.length===n)break}return out};
  const header=()=>`<div class="progress"><div style="width:${(qi/qs.length)*100}%"></div></div>
    <div class="meta"><span>Pregunta ${qi+1} / ${qs.length}</span><span>${combo>1?"🔥 x"+combo:"Puntos "+score}</span></div>`;
  const reveal=(ok,a,extra)=>{
    if(ok){score++;combo++;best=Math.max(best,combo)}else combo=0;
    sfx(ok); buzz(ok?30:[40,40,40]);
    const fb=$("#fb"); fb.innerHTML=`<b style="color:${ok?"var(--good)":"var(--bad)"}">${ok?["¡Eso!","¡Exacto!","¡Ándale!","¡Padre!"][Math.floor(Math.random()*4)]:"Casi"}</b>${extra||""}`;
    $("#after").innerHTML=nextBtn(qi<qs.length-1?"Siguiente":"Ver resultado"); $("#next").onclick=()=>{qi++;qi<qs.length?ask():results()};
    setTimeout(()=>say(a.es,.85),ok?350:150);
  };
  const ask=()=>{
    const q=qs[qi], a=q.a; hush();
    if(q.t==="listen"){
      const opts=shuffle([a,...distinct(allP,"e",3,a.e)]);
      app.innerHTML=`<div class="wrap">${header()}<div class="q">Escucha y elige la imagen</div>
        <button class="bigplay" id="rep" aria-label="Escuchar">🔊</button>
        <div class="opts">${opts.map((o,j)=>`<button class="opt em" data-j="${j}" aria-label="opción ${j+1}">${o.e}</button>`).join("")}</div>
        <div class="fb" id="fb"></div><div id="after"></div></div>`;
      $("#rep").onclick=()=>say(a.es,.8); setTimeout(()=>say(a.es,.8),250);
      document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=opts[+b.dataset.j]===a; mark(b,ok,opts.findIndex(o=>o===a)); reveal(ok,a,`<span class="muted">${esc(a.es)}<br>${esc(a.en)}</span>`)});
    }
    if(q.t==="emoji"){
      const opts=shuffle([a,...distinct(allP.filter(p=>p.es!==a.es),"es",3,a.es)]);
      app.innerHTML=`<div class="wrap">${header()}<div class="q">¿Cómo se dice?</div>
        ${cardHTML({emoji:a.e,es:"",en:esc(a.en),bar:"Elige la frase"}).replace('class="lphrase" id="lph"','class="lphrase" id="lph" style="display:none"')}
        <div class="opts one">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o.es)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div><div id="after"></div></div>`;
      document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=opts[+b.dataset.j]===a; mark(b,ok,opts.findIndex(o=>o===a)); reveal(ok,a,"")});
    }
    if(q.t==="slang"){
      const opts=shuffle([a,...distinct(allS.filter(s=>s.en!==a.en),"en",3,a.en)]);
      app.innerHTML=`<div class="wrap">${header()}<div class="q">¿Qué significa?</div>
        ${cardHTML({emoji:a.e,es:esc(a.es),en:REG[a.r]||"",bar:"Slang"})}
        <div class="opts one">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o.en)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div><div id="after"></div></div>`;
      $("#lph").style.minHeight="0"; say(a.es,.8);
      document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=opts[+b.dataset.j]===a; mark(b,ok,opts.findIndex(o=>o===a)); reveal(ok,{es:a.x},`<span class="muted">${esc(a.x)}<br>${esc(a.xe)}</span>`)});
    }
    if(q.t==="build"){
      const words=a.es.split(" "); let tiles=shuffle(words.map((w,j)=>({w,j,used:false}))); let ans=[];
      if(tiles.map(t=>t.w).join(" ")===a.es) tiles.reverse();
      app.innerHTML=`<div class="wrap">${header()}<div class="q">Arma la frase</div>
        <div class="panel" style="text-align:center"><div style="font-size:48px;line-height:1.1">${a.e}</div><div class="muted">${esc(a.en)}</div></div>
        <div class="slots" id="slots" aria-label="Tu frase"></div>
        <div class="row" id="tiles" style="justify-content:center;flex-wrap:wrap"></div>
        <div class="fb" id="fb"></div><div id="after"></div></div>`;
      const draw=()=>{
        $("#slots").innerHTML=ans.map((t,x)=>`<button class="tile" data-x="${x}">${esc(t.w)}</button>`).join("");
        $("#tiles").innerHTML=tiles.map((t,x)=>`<button class="tile ${t.used?"used":""}" data-t="${x}" style="flex:0 0 auto">${esc(t.w)}</button>`).join("");
        document.querySelectorAll("#tiles .tile").forEach(b=>b.onclick=()=>{const t=tiles[+b.dataset.t]; t.used=true; ans.push(t); say(t.w,.8); draw(); if(ans.length===words.length) check()});
        document.querySelectorAll("#slots .tile").forEach(b=>b.onclick=()=>{const t=ans.splice(+b.dataset.x,1)[0]; t.used=false; draw()});
      };
      const check=()=>{
        const ok=ans.map(t=>t.w).join(" ")===a.es;
        document.querySelectorAll(".tile").forEach(b=>b.style.pointerEvents="none");
        $("#slots").classList.add(ok?"x":"shake");
        reveal(ok,a,`<span class="muted">${esc(a.es)}</span>`);
      };
      draw();
    }
  };
  const mark=(btn,ok,rightIdx)=>{
    const all=[...document.querySelectorAll(".opt")]; all.forEach(b=>b.disabled=true);
    btn.classList.add(ok?"right":"wrong"); if(!ok){all[rightIdx].classList.add("right"); btn.classList.add("shake")}
  };
  const results=()=>{
    hush(); cancelAnimationFrame(raf);
    const pct=score/qs.length, msg=pct>=.9?["🏆","¡Eres una máquina!"]:pct>=.7?["🌟","¡Muy bien!"]:pct>=.5?["💪","¡Vas bien!"]:["🌱","Mañana lo repites y sube"];
    app.innerHTML=`<div class="wrap">${cardHTML({emoji:msg[0],es:esc(msg[1]),en:`${score} de ${qs.length} correctas · mejor racha ${best}`,bar:"Juego listo"})}${nextBtn("Cierre del día")}</div>`;
    wireNext(); sfx(true);
  };
  ask();
}

/* ------------------------------------------------------------------ 5 · CIERRE */
function finish(){
  const l=L(); hush();
  if(!doneToday()){ S.hist.push({d:today(),l:curIdx()}); save(); }
  const days=new Set(S.hist.map(h=>h.d)); const wd="LMXJVSD"; const week=[];
  for(let k=6;k>=0;k--){const d=new Date(); d.setDate(d.getDate()-k); const key=ymd(d); const idx=(d.getDay()+6)%7;
    week.push(`<div class="${days.has(key)?"hit":""} ${k===0?"today":""}"><span>${days.has(key)?"✓":""}</span>${wd[idx]}</div>`)}
  const nx=LESSONS[(S.hist.length)%N];
  app.innerHTML=`<div class="wrap">
    ${cardHTML({emoji:"🎊",es:"¡Cumpliste hoy!",en:`Día ${S.hist.length} · racha de ${streak()}`,bar:"Diez minutos"})}
    <div class="panel mission"><div class="kicker">Misión de hoy</div><p style="font-size:18px;font-weight:600;margin-top:4px">${esc(l.m)}</p></div>
    <div class="panel"><div class="kicker" style="margin-bottom:10px">Esta semana</div><div class="week">${week.join("")}</div></div>
    <div class="panel"><div class="kicker">Mañana</div><p style="font-weight:700;font-size:18px;margin-top:2px">${nx.e} ${esc(nx.t)}</p><p class="muted">${esc(nx.theme)}</p></div>
    <button class="btn block" id="again">Repetir el ritmo del día</button>
    <div style="text-align:center"><button class="link" id="reset">Borrar mi progreso</button></div></div>`;
  $("#again").onclick=()=>go(1);
  let armed=false; $("#reset").onclick=()=>{ if(!armed){armed=true; $("#reset").textContent="Toca otra vez para confirmar"; return} S={hist:[]}; save(); override=null; go(-1)};
  renderSteps();
}

$(".brand").onclick=()=>go(-1);
go(-1);
</script>
